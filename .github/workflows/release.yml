name: release

# Publishes to PyPI when a version tag (v0.1.0, ...) is pushed, after the tests pass and the tag
# matches the package version.
# One-time setup on PyPI: add this repository/workflow as a "trusted publisher" for the project.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,plot,taup]"
      - run: python -m pytest -q
      - name: tag matches package version
        run: |
          python - <<'EOF'
          import os, re
          version = re.search(r'__version__ = "([^"]+)"', open("src/pyfocmec/__init__.py").read()).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}", f"tag {tag} does not match package version {version}"
          EOF

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
